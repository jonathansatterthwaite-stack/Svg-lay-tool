<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>svg-lay-tool demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0f1013; color: #e6e8ee; font-family: system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid #2e323b; background: #15171c; }
      header h1 { font-size: 14px; margin: 0; font-weight: 600; }
      header span { color: #8a90a0; font-size: 12px; }
      header button { margin-left: auto; background: #23262e; color: inherit; border: 1px solid #2e323b; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
      header button + button { margin-left: 0; }
      #editor { flex: 1; min-height: 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>svg-lay-tool</h1>
      <span>Layer-based shape editor demo · everything below is the embeddable component</span>
      <button id="theme" type="button">Toggle theme</button>
      <button id="reset" type="button">Reset sample</button>
    </header>
    <div id="editor"></div>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
